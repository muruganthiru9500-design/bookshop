<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white p-6 max-w-md mx-auto">
<h1 class="text-2xl font-black">Sell Book - FINAL FIX</h1>
<p class="text-xs text-gray-500">Version 3 - No SDK Bug</p>

<input id="bname" placeholder="Book Name" class="w-full p-3 border-2 mt-4 rounded-xl">
<input id="bmrp" placeholder="MRP ₹600" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="bprice" placeholder="Your Price ₹150" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="bphone" placeholder="WhatsApp 10 digit" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="file" type="file" accept="image/*" class="mt-3">
<img id="prev" class="hidden w-full h-40 object-cover mt-2 rounded-xl">
<button id="btn" class="w-full bg-black text-white p-3 mt-4 font-bold rounded-xl" onclick="sell()">SELL NOW</button>
<p id="msg" class="text-center text-sm mt-2"></p>

<script>
const PROJECT_ID = "book-shop-a1a26";
const API_KEY = "AIzaSyAAL7vg4zzI6VPePYgjfDMxNQPCMPiA2vo";
const IMGBB_KEY = "99fe3421c3395abafe7a51e6be3cf190";
let imageData = "";

document.getElementById("file").onchange = e => {
  const r = new FileReader();
  r.onload = ev => {
    imageData = ev.target.result;
    document.getElementById("prev").src = imageData;
    document.getElementById("prev").classList.remove("hidden");
  };
  r.readAsDataURL(e.target.files[0]);
};

async function sell(){
  const name = document.getElementById("bname").value.trim();
  const mrp = document.getElementById("bmrp").value.trim() || "0";
  const price = document.getElementById("bprice").value.trim();
  const phone = document.getElementById("bphone").value.trim();
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  if(!name){ alert("Enter book name"); return; }
  if(!price){ alert("Enter price"); return; }
  if(!phone){ alert("Enter phone"); return; }
  if(!imageData){ alert("Select photo"); return; }

  btn.disabled=true;
  btn.innerText="Uploading...";
  msg.innerText="Step 1/2: Uploading image...";

  let imageUrl = imageData;

  // Try ImgBB
  try{
    const file = document.getElementById("file").files[0];
    const fd = new FormData();
    fd.append("image", file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:"POST", body:fd});
    const data = await res.json();
    if(data.success) imageUrl = data.data.url;
  }catch(e){ console.log("ImgBB skip, using base64"); }

  msg.innerText="Step 2/2: Saving to Firebase...";

  // Save via REST API - No SDK needed
  const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/books?key=${API_KEY}`;
  
  const body = {
    fields: {
      name: {stringValue: name},
      mrp: {stringValue: mrp},
      price: {stringValue: price},
      phone: {stringValue: phone},
      image: {stringValue: imageUrl},
      createdAt: {timestampValue: new Date().toISOString()}
    }
  };

  try{
    const resp = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    const result = await resp.json();
    console.log(result);
    if(result.name || result.fields){
      alert("✅ SUCCESS! Book is Live!");
      window.location.href="index.html";
    }else{
      throw new Error(JSON.stringify(result));
    }
  }catch(err){
    alert("Firebase Error: "+err.message+"\n\nCheck: 1. Firestore Rules = allow read,write if true 2. Firestore Database Created");
    console.error(err);
    btn.disabled=false;
    btn.innerText="SELL NOW";
    msg.innerText="Failed. Check console (F12)";
  }
}
</script>
</body></html>
