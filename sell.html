<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white p-6 max-w-md mx-auto">
<h1 class="text-2xl font-black">Sell in 20 Sec 📚</h1>
<input id="bname" placeholder="Book Name" class="w-full p-3 border-2 mt-4 rounded-xl">
<input id="bmrp" placeholder="MRP ₹600" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="bprice" placeholder="Your Price ₹150" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="bphone" placeholder="WhatsApp 10 digit" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="file" type="file" accept="image/*" class="mt-3">
<img id="prev" class="hidden w-full h-40 object-cover mt-2 rounded-xl">
<button id="btn" class="w-full bg-black text-white p-3 mt-4 font-bold rounded-xl">SELL NOW</button>
<p id="status" class="text-center text-sm mt-2 text-gray-500"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAAL7vg4zzI6VPePYgjfDMxNQPCMPiA2vo", authDomain: "book-shop-a1a26.firebaseapp.com", projectId: "book-shop-a1a26", storageBucket: "book-shop-a1a26.firebasestorage.app", messagingSenderId: "368942909095", appId: "1:368942909095:web:cea46dfbd6b36ebdb0fd82" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);
const IMGBB_KEY="99fe3421c3395abafe7a51e6be3cf190";

let imageData="";

document.getElementById("file").onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    imageData = ev.target.result;
    document.getElementById("prev").src = imageData;
    document.getElementById("prev").classList.remove("hidden");
  };
  r.readAsDataURL(file);
};

document.getElementById("btn").onclick = async () => {
  const bname = document.getElementById("bname").value.trim();
  const bmrp = document.getElementById("bmrp").value.trim();
  const bprice = document.getElementById("bprice").value.trim();
  const bphone = document.getElementById("bphone").value.trim();
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");

  console.log(bname, bmrp, bprice, bphone);

  if(!bname || !bprice || !bphone){
    alert("Please fill Book Name, Price and Phone");
    return;
  }
  if(!imageData){
    alert("Please select photo");
    return;
  }

  btn.disabled=true; 
  btn.innerText="Uploading...";
  status.innerText="Uploading image to ImgBB...";

  try{
    let imageUrl = imageData;
    // Try ImgBB upload
    try{
      const fd = new FormData();
      fd.append("image", document.getElementById("file").files[0]);
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:"POST", body:fd});
      const data = await res.json();
      if(data.data && data.data.url){ imageUrl = data.data.url; }
    }catch(imgErr){ console.log("ImgBB failed, using base64", imgErr); }

    status.innerText="Saving to Firebase...";
    await addDoc(collection(db,"books"),{
      name: bname,
      mrp: bmrp || "0",
      price: bprice,
      phone: bphone,
      image: imageUrl,
      createdAt: serverTimestamp()
    });
    alert("✅ Book Live!");
    location.href="index.html";
  }catch(e){
    alert("Error: "+e.message);
    console.error(e);
    btn.disabled=false;
    btn.innerText="SELL NOW";
    status.innerText="";
  }
};
</script>
</body></html>
