<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white p-6 max-w-md mx-auto">
<h1 class="text-2xl font-black">Sell Your Book 📚</h1>
<p class="text-xs text-green-600">Instant Upload - No Stuck</p>
<input id="name" placeholder="Book Name" class="w-full p-3 border-2 mt-4 rounded-xl">
<input id="mrp" placeholder="MRP ₹600" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="price" placeholder="Your Price ₹150" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="phone" placeholder="WhatsApp No" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="image" type="file" accept="image/*" class="mt-3">
<img id="preview" class="hidden w-full h-40 object-cover mt-2 rounded-xl">
<button id="btn" onclick="sell()" class="w-full bg-black text-white p-3 mt-4 font-bold rounded-xl">SELL NOW - INSTANT</button>

<script>
document.getElementById("image").onchange=e=>{
 const file=e.target.files[0];
 const reader=new FileReader();
 reader.onload=ev=>{
  document.getElementById("preview").src=ev.target.result;
  document.getElementById("preview").classList.remove("hidden");
  document.getElementById("preview").dataset.base64=ev.target.result;
 };
 reader.readAsDataURL(file);
}

async function sell(){
 if(!document.getElementById("name").value){ alert("Enter book name"); return; }
 const img=document.getElementById("preview").dataset.base64;
 if(!img){ alert("Select photo"); return; }
 const book={
  name:document.getElementById("name").value,
  mrp:document.getElementById("mrp").value,
  price:document.getElementById("price").value,
  phone:document.getElementById("phone").value,
  image:img,
  date:Date.now()
 };
 let books=JSON.parse(localStorage.getItem("books")||"[]");
 books.push(book);
 localStorage.setItem("books",JSON.stringify(books));
 alert("✅ Book Added! Now Live on Homepage");
 location.href="index.html";
}
</script>
</body></html>
