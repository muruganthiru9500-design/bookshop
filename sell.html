<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white p-6 max-w-md mx-auto">
<h1 class="text-2xl font-black">Sell in 20 Sec</h1>
<input id="name" placeholder="Book Name" class="w-full p-3 border-2 mt-4 rounded-xl">
<input id="mrp" placeholder="MRP ₹600" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="price" placeholder="Your Price ₹150" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="phone" placeholder="WhatsApp 10 digit" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="file" type="file" accept="image/*" class="mt-3">
<img id="prev" class="hidden w-full h-40 object-cover mt-2 rounded-xl">
<button id="btn" class="w-full bg-black text-white p-3 mt-4 font-bold rounded-xl">SELL NOW</button>
<p id="status" class="text-center text-sm mt-2"></p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAAL7vg4zzI6VPePYgjfDMxNQPCMPiA2vo", authDomain: "book-shop-a1a26.firebaseapp.com", projectId: "book-shop-a1a26", storageBucket: "book-shop-a1a26.firebasestorage.app", messagingSenderId: "368942909095", appId: "1:368942909095:web:cea46dfbd6b36ebdb0fd82" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const IMGBB_KEY="99fe3421c3395abafe7a51e6be3cf190";
let base64=""; document.getElementById("file").onchange=e=>{
 const r=new FileReader(); r.onload=ev=>{ base64=ev.target.result; document.getElementById("prev").src=base64; document.getElementById("prev").classList.remove("hidden"); }; r.readAsDataURL(e.target.files[0]);
};
document.getElementById("btn").onclick=async()=>{
 const btn=document.getElementById("btn"), status=document.getElementById("status");
 if(!name.value||!price.value||!phone.value){ alert("Fill all"); return; }
 btn.disabled=true; btn.innerText="Uploading..."; status.innerText="Uploading image...";
 try{
  let imageUrl=base64;
  if(document.getElementById("file").files[0]){
   const fd=new FormData(); fd.append("image", document.getElementById("file").files[0]);
   const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:"POST",body:fd});
   const data=await res.json(); imageUrl=data.data.url;
  }
  status.innerText="Saving to database...";
  await addDoc(collection(db,"books"),{name:name.value,mrp:mrp.value,price:price.value,phone:phone.value,image:imageUrl,createdAt:serverTimestamp()});
  alert("✅ Book Live for All Students!"); location.href="index.html";
 }catch(e){ alert(e.message); btn.disabled=false; btn.innerText="SELL NOW"; }
};
</script>
</body></html>
