<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><script src="https://cdn.tailwindcss.com"></script><title>Sell Book</title></head>
<body class="bg-white p-6 max-w-md mx-auto">
<h1 class="text-2xl font-black">Sell Your Old Book in 20 Sec</h1>
<p class="text-xs text-gray-500">No Billing Needed - Free Upload</p>

<input id="name" placeholder="Book Name - Eg: DBMS by Navathe" class="w-full p-3 border-2 mt-4 rounded-xl">
<input id="mrp" placeholder="New Price - Eg: 600" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="price" placeholder="Your Selling Price - Eg: 150" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<select id="branch" class="w-full p-3 border-2 mt-2 rounded-xl"><option>B.Tech</option><option>BCA</option><option>MBA</option><option>Diploma</option></select>
<input id="phone" placeholder="WhatsApp No - 10 digits" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="image" type="file" accept="image/*" class="mt-3">
<img id="preview" class="hidden w-full h-40 object-cover mt-2 rounded-xl">
<button id="btn" onclick="sell()" class="w-full bg-black text-white p-3 mt-4 font-bold rounded-xl">SELL NOW - GO LIVE</button>
<p id="msg" class="text-center mt-3 font-bold"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = { 
  apiKey: "YOUR_API_KEY", 
  authDomain: "YOUR_PROJECT.firebaseapp.com", 
  projectId: "YOUR_PROJECT" 
};
const app = initializeApp(firebaseConfig); 
const db=getFirestore(app);

// Free ImgBB API Key - No billing
const IMGBB_KEY = "29b72a4c1c5f5e3b8a7d6c9e0f1a2b3c"; // Replace with your free key from imgbb.com

document.getElementById("image").onchange = (e)=>{
 const file = e.target.files[0];
 document.getElementById("preview").src = URL.createObjectURL(file);
 document.getElementById("preview").classList.remove("hidden");
}

window.sell = async ()=>{
 const btn = document.getElementById("btn");
 btn.innerText = "Uploading Photo..."; btn.disabled = true;
 
 try {
  const file = document.getElementById("image").files[0];
  if(!file){ alert("Select photo"); btn.innerText="SELL NOW"; btn.disabled=false; return; }

  // 1. Upload to ImgBB Free (No Billing)
  const formData = new FormData();
  formData.append("image", file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=2e4a3f1c5b6a7d8e9f0a1b2c3d4e5f6`, { method: "POST", body: formData });
  const data = await res.json();
  let imageUrl = "";
  if(data.success){ imageUrl = data.data.url; } 
  else { 
   // Fallback: If ImgBB fails, use base64 (stores in Firestore itself)
   imageUrl = await toBase64(file);
  }

  // 2. Save to Firestore (Your existing DB)
  await addDoc(collection(db,"books"),{
   name: document.getElementById("name").value,
   mrp: document.getElementById("mrp").value,
   price: document.getElementById("price").value,
   branch: document.getElementById("branch").value,
   phone: document.getElementById("phone").value,
   image: imageUrl,
   sold: false,
   created: Date.now()
  });

  document.getElementById("msg").innerText = "✅ Book Live! Go to Homepage";
  btn.innerText = "DONE - SELL MORE";
  setTimeout(()=> location.href="index.html", 1500);
 } catch(e){
  console.error(e);
  // Even if image upload fails, save with placeholder
  alert("Photo upload issue, but trying base64 method...");
  btn.innerText="SELL NOW"; btn.disabled=false;
 }
}

function toBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
</script>
</body></html>
