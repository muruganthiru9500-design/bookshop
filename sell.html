<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><script src="https://cdn.tailwindcss.com"></script><title>Sell Book</title></head>
<body class="bg-white p-6 max-w-md mx-auto">
<h1 class="text-2xl font-black">Sell Your Old Book 📚</h1>
<input id="name" placeholder="Book Name" class="w-full p-3 border-2 mt-4 rounded-xl">
<input id="mrp" placeholder="MRP ₹600" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="price" placeholder="Your Price ₹150" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<select id="branch" class="w-full p-3 border-2 mt-2 rounded-xl"><option>B.Tech</option><option>BCA</option><option>MBA</option><option>Diploma</option></select>
<input id="phone" placeholder="WhatsApp No" type="number" class="w-full p-3 border-2 mt-2 rounded-xl">
<input id="image" type="file" accept="image/*" class="mt-3">
<img id="preview" class="hidden w-full h-40 object-cover mt-2 rounded-xl">
<button id="btn" onclick="sell()" class="w-full bg-black text-white p-3 mt-4 font-bold rounded-xl">SELL NOW</button>
<p id="msg" class="text-center mt-3 font-bold"></p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT" };
const app = initializeApp(firebaseConfig); const db=getFirestore(app);
const IMGBB_KEY = "99fe3421c3395abafe7a51e6be3cf190";
document.getElementById("image").onchange = (e)=>{ document.getElementById("preview").src = URL.createObjectURL(e.target.files[0]); document.getElementById("preview").classList.remove("hidden"); }
window.sell = async ()=>{
 const btn=document.getElementById("btn"); btn.innerText="Uploading..."; btn.disabled=true;
 try{
  const file=document.getElementById("image").files[0];
  const fd=new FormData(); fd.append("image", file);
  const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:"POST",body:fd});
  const data=await res.json(); const imageUrl=data.data.url;
  await addDoc(collection(db,"books"),{name:document.getElementById("name").value,mrp:document.getElementById("mrp").value,price:document.getElementById("price").value,branch:document.getElementById("branch").value,phone:document.getElementById("phone").value,image:imageUrl,sold:false,created:Date.now()});
  document.getElementById("msg").innerText="✅ LIVE! Redirecting..."; setTimeout(()=>location.href="index.html",1500);
 }catch(e){ alert("Error: "+e.message); btn.innerText="SELL NOW"; btn.disabled=false; }
}
</script>
</body></html>
