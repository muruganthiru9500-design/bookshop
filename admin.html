<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><title>Admin - Kitab Bazaar</title></head>
<body class="bg-gray-900 text-white p-4 max-w-6xl mx-auto min-h-screen">
<div class="flex justify-between items-center">
<h1 class="text-3xl font-black">🔒 ADMIN PANEL</h1>
<a href="index.html" class="bg-white text-black px-4 py-2 rounded-full font-bold">View Site</a>
</div>
<p class="text-gray-400 text-sm mt-2">Project: book-shop-a1a26 | Total Books Below</p>
<div id="books" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6"><p>Loading...</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = { 
  apiKey: "AIzaSyAAL7vg4zzI6VPePYgjfDMxNQPCMPiA2vo", 
  authDomain: "book-shop-a1a26.firebaseapp.com", 
  projectId: "book-shop-a1a26", 
  storageBucket: "book-shop-a1a26.firebasestorage.app", 
  messagingSenderId: "368942909095", 
  appId: "1:368942909095:web:cea46dfbd6b36ebdb0fd82" 
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  const q = query(collection(db, "books"), orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  let html=""; let count=0;
  snap.forEach(d=>{
    count++;
    const b=d.data();
    html+=`
    <div class="bg-white text-black p-4 rounded-2xl shadow-lg">
      <img src="${b.image}" class="h-40 w-full object-cover rounded-xl">
      <p class="font-black mt-2">${b.name}</p>
      <p class="text-sm">MRP ₹${b.mrp} | Sell ₹${b.price}</p>
      <p class="text-xs bg-gray-100 p-2 rounded mt-2">📱 ${b.phone}</p>
      <div class="flex gap-2 mt-3">
        <a href="https://wa.me/91${b.phone}" target="_blank" class="flex-1 bg-green-500 text-white text-center py-2 rounded-lg font-bold text-sm">WhatsApp</a>
        <button onclick="del('${d.id}')" class="flex-1 bg-red-500 text-white py-2 rounded-lg font-bold text-sm">DELETE</button>
      </div>
    </div>`;
  });
  document.getElementById("books").innerHTML = html || "<p class='text-white'>No books yet</p>";
  if(count>0) document.querySelector("p.text-gray-400").innerText = `Project: book-shop-a1a26 | Total Books: ${count}`;
}

window.del = async (id)=>{
  if(!confirm("Delete this book permanently?")) return;
  await deleteDoc(doc(db, "books", id));
  alert("Deleted ✅"); load();
}

load();
</script>
</body></html>
