<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><title>Kitab Bazaar</title></head>
<body class="bg-gray-50 p-4 max-w-6xl mx-auto">
<h1 class="text-3xl font-black">📚 KITAB-BAZAAR - IIIT BBSR</h1><a href="sell.html" class="bg-black text-white px-4 py-2 rounded-full mt-3 inline-block">SELL BOOK</a>
<div id="books" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"><p>Loading books...</p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAAL7vg4zzI6VPePYgjfDMxNQPCMPiA2vo", authDomain: "book-shop-a1a26.firebaseapp.com", projectId: "book-shop-a1a26", storageBucket: "book-shop-a1a26.firebasestorage.app", messagingSenderId: "368942909095", appId: "1:368942909095:web:cea46dfbd6b36ebdb0fd82" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const q = query(collection(db, "books"), orderBy("createdAt","desc"));
const snap = await getDocs(q); let html="";
snap.forEach(d=>{ const b=d.data(); html+=`<div class="bg-white p-3 rounded-xl shadow"><img src="${b.image}" class="h-36 w-full object-cover rounded-lg"><p class="font-bold mt-2 truncate">${b.name}</p><p class="text-xs">MRP ₹${b.mrp} → <span class="font-bold text-green-600">₹${b.price}</span></p><a href="https://wa.me/91${b.phone}?text=Hi, I want ${b.name} for ₹${b.price} from Kitab-Bazaar" class="block bg-green-500 text-white text-center p-2 mt-2 rounded-lg font-bold text-sm">Buy on WhatsApp</a></div>`; });
document.getElementById("books").innerHTML=html||"<p>No books yet. Be first to sell!</p>";
</script>
</body></html>
