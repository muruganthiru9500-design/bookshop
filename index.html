<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>book shop - Old Books for Students</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50">
<nav class="bg-black text-white p-4 flex justify-between">
<h1 class="font-bold text-xl">📚 book shop</h1>
<a href="sell.html" class="bg-yellow-400 text-black px-4 py-1 rounded-full font-bold">+ SELL BOOK</a>
</nav>

<div class="p-4">
<input id="search" onkeyup="searchBooks()" placeholder="Search book - Eg: DBMS, EEE, BCA..." class="w-full p-3 rounded-xl border-2 border-black">
<div class="flex gap-2 mt-3">
<select id="branch" onchange="filterBooks()" class="p-2 rounded-lg border"><option value="">All Branch</option><option>B.Tech</option><option>BCA</option><option>MBA</option><option>Diploma</option></select>
<select id="price" onchange="filterBooks()" class="p-2 rounded-lg border"><option value="">Any Price</option><option value="100">Under ₹100</option><option value="200">Under ₹200</option></select>
</div>
</div>

<div id="books" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allBooks = [];
async function loadBooks(){
 const snap = await getDocs(collection(db, "books"));
 allBooks = []; snap.forEach(d=> allBooks.push(d.data()));
 showBooks(allBooks);
}
function showBooks(list){
 document.getElementById("books").innerHTML = list.map(b=> `
  <div class="bg-white rounded-xl p-2 border-2 border-black">
   <img src="${b.image}" class="h-32 w-full object-cover rounded-lg">
   <h3 class="font-bold mt-2">${b.name}</h3>
   <p class="text-xs">${b.branch} - ${b.sem}</p>
   <p class="font-bold text-green-600">₹${b.price} <span class="line-through text-gray-400 text-xs">₹${b.mrp}</span></p>
   <a href="https://wa.me/91${b.phone}?text=Hi, I want ${b.name}" class="block bg-black text-white text-center py-1 rounded mt-2 text-sm">WhatsApp Buy</a>
  </div>`).join('');
}
window.searchBooks = ()=>{ const q=document.getElementById("search").value.toLowerCase(); showBooks(allBooks.filter(b=> b.name.toLowerCase().includes(q))); }
window.filterBooks = ()=>{ let f=allBooks; const br=document.getElementById("branch").value; if(br) f=f.filter(b=> b.branch==br); showBooks(f); }
loadBooks();
</script>
</body>
</html>
